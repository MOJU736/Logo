<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PQ Event Logo Animation</title>
<style>
  :root { --maroon:#8B181B; --orange:#EF5F23; --tag:#F46004; --bg:#fff; }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; }
  svg { width:min(92vw,1100px); height:auto; overflow:visible; }
  .chev { fill:none; stroke-width:30; stroke-linecap:round; stroke-linejoin:round; }
  .m { stroke:var(--maroon); } .o { stroke:var(--orange); }
  .icon { transform-origin:398px 970px; animation: breathe 4s ease-in-out 3s infinite; }
  .c { opacity:0; animation: in .9s cubic-bezier(.2,.8,.2,1) forwards; }
  .top { --dx:0px; --dy:-120px; animation-delay:.1s; }
  .bot { --dx:0px; --dy:120px; animation-delay:.25s; }
  .left{ --dx:-120px; --dy:0px; animation-delay:.4s; }
  .right{--dx:120px; --dy:0px; animation-delay:.55s; }
  @keyframes in { from{opacity:0; transform:translate(var(--dx),var(--dy))} to{opacity:1; transform:none} }
  .dia { fill:var(--maroon); transform-origin:398px 970px; transform:scale(0); animation: pop .6s cubic-bezier(.3,1.6,.5,1) .95s forwards; }
  @keyframes pop { to{transform:scale(1)} }
  .ring { fill:none; stroke:var(--orange); stroke-width:3; transform-origin:398px 970px; opacity:0; animation: ring 1.2s ease-out 1s; }
  @keyframes ring { 0%{opacity:.6; transform:scale(.2)} 100%{opacity:0; transform:scale(3.2)} }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .title { font:700 210px "Segoe UI","Open Sans","Noto Sans","DejaVu Sans",Arial,sans-serif; fill:var(--maroon); }
  .tag { font:600 112px "Segoe UI","Open Sans","Noto Sans","DejaVu Sans",Arial,sans-serif; fill:var(--tag); opacity:0; animation: fade .9s ease-out 1.9s forwards; }
  @keyframes fade { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }
  #wipe { animation: wipe 1s cubic-bezier(.6,0,.2,1) 1.1s forwards; transform:translateX(-1100px); }
  @keyframes wipe { to{transform:translateX(0)} }
  .shine { fill:url(#g); mix-blend-mode:normal; animation: shine 1.4s ease-in-out 3.2s infinite; transform:translateX(-400px); opacity:.0; }
  @keyframes shine { 0%{transform:translateX(-300px);opacity:0} 20%{opacity:.5} 60%,100%{transform:translateX(1500px);opacity:0} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; opacity:1!important; transform:none!important} .dia{transform:none!important} .ring,.shine{display:none} }
</style>
</head>
<body>
<svg viewBox="200 780 1540 400" role="img" aria-label="PQ Event – Simply Exceptional">
  <defs>
    <clipPath id="tc"><rect x="610" y="780" width="1120" height="220"/></clipPath>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="all"><rect x="200" y="780" width="1540" height="400"/></clipPath>
  </defs>
  <g class="icon">
    <circle class="ring" cx="398" cy="970" r="60"/>
    <polyline class="chev o c top"   points="300,832 398,928 497,832"/>
    <polyline class="chev o c bot"   points="300,1108 398,1012 497,1108"/>
    <polyline class="chev m c left"  points="258,872 358,970 258,1068"/>
    <polyline class="chev m c right" points="538,872 438,970 538,1068"/>
    <polygon class="dia" points="398,945 423,970 398,995 374,970"/>
  </g>
  <g clip-path="url(#tc)">
    <g id="wipe"><text class="title" x="620" y="968" textLength="1068" lengthAdjust="spacingAndGlyphs">PQ EVENT</text></g>
  </g>
  <text class="tag" x="614" y="1127" textLength="1051" lengthAdjust="spacingAndGlyphs">Simply Exceptional</text>
  <g clip-path="url(#all)"><rect class="shine" x="200" y="780" width="240" height="400" transform="skewX(-20)"/></g>
</svg>
</body>
</html>
